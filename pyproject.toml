[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weatherloo"
version = "0.1.0"
description = "HRRR post-processing experiments for Waterloo-region station-supervised temperature correction."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib",
  "netCDF4",
  "numpy",
  "pandas",
  "s3fs",
  "xarray",
  "torch",
  "zarr",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

